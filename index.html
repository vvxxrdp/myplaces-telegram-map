<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Карта мест</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body { height: 100%; margin: 0; background: #0b0f19; }
    #map { height: 100%; width: 100%; }
    .popup-title { font-weight: 700; margin-bottom: 6px; }
    .popup-link { display: inline-block; margin-top: 6px; color: #2ea8ff; text-decoration: none; }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  const PLACES = [
    /* ВСТАВЬ СЮДА СОДЕРЖИМОЕ places.json ЦЕЛИКОМ */
    /* пример:
    {
      "title":"Мясницкий бар",
      "address":"Мясницкий пр., 2/1",
      "lat":55.768390,
      "lng":37.646372,
      "tag":"#Красные_ворота",
      "link":"https://t.me/myasnitskiybar"
    }
    */
  ];

  async function loadPlaces() {
    const places = PLACES;

    for (const p of places) {
      const marker = L.marker([p.lat, p.lng]).addTo(map);

      const popupHtml = `
        <div class="popup-title">${escapeHtml(p.title || '')}</div>
        <div>${escapeHtml(p.address || '')}</div>
        ${p.tag ? `<div>${escapeHtml(p.tag)}</div>` : ''}
        ${p.link ? `<a class="popup-link" target="_blank" rel="noopener" href="${escapeAttr(p.link)}">Открыть место</a>` : ''}
      `;
      marker.bindPopup(popupHtml);
    }
  }
</script>

</body>
</html>
