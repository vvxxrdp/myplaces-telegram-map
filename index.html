<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Карта мест</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.css" />

  <style>
    html, body { height: 100%; margin: 0; background: #0b0f19; }
    #map { height: 100%; width: 100%; position: relative; }

    #overlay {
      position: fixed;
      inset: 0;
      background: #0b0f19;
      z-index: 9999;
      display: none;
    }
    #overlay-inner{
      padding: 18px;
      color: #fff;
      font-family: sans-serif;
    }

    .place-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      background: rgba(255,255,255,0.08);
    }
    .place-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .popup-link { display: inline-block; margin-top: 6px; color: #2ea8ff; text-decoration: none; }
    .popup-title { font-weight: 700; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="overlay">
    <div id="overlay-inner">Открываю пост...</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.js"></script>

  <script>
    const PLACES = [
      {
        "title":"Мясницкий бар",
        "address":"Мясницкий пр., 2/1",
        "lat":55.768390,
        "lng":37.646372,
        "tag":"#Красные_ворота",
        "link":"https://t.me/glfmgfldofkom/2",
        "image":"https://img.magnific.com/free-photo/autumn-landscape-of-forestry-road_23-2151843655.jpg?size=626&ext=jpg"
      },
      {
        "title":"Mbar",
        "address":"Лесная ул., 20, стр. 1",
        "lat":55.780522,
        "lng":37.592132,
        "tag":"#Белорусская",
        "link":"https://t.me/glfmgfldofkom/5",
        "image":"https://img.magnific.com/free-photo/autumn-landscape-of-forestry-road_23-2151843655.jpg?size=626&ext=jpg"
      }
    ];

    const MAP_CENTER = [55.768390, 37.646372];
    const MAP_ZOOM = 15;

    // Твоя цель: открыть t.me/glfmgfldofkom/...,
    // но сначала открыть страницу бота.
    const BOT_INTERSTITIAL = "https://t.me/wjrbot_bot";

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[s]));
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, '&quot;');
    }

    function createMarkerElement(imageUrl) {
      const el = document.createElement('div');
      el.className = 'place-icon';

      const img = document.createElement('img');
      img.alt = '';
      img.onerror = () => { img.style.display = 'none'; };
      if (imageUrl) img.src = imageUrl;

      el.appendChild(img);
      return el;
    }

    function showOverlayAndHideMap() {
      const overlay = document.getElementById('overlay');
      const mapEl = document.getElementById('map');
      if (overlay) overlay.style.display = 'block';
      if (mapEl) mapEl.style.display = 'none';
    }

    function openPostWithBotFirst(postUrl) {
      const tg = window.Telegram?.WebApp;

      // Небольшая пауза, чтобы Telegram успел инициировать первый переход
      // и не "похоронил" открытие второго.
      const delayMs = 120;

      const openViaTelegram = (url) => {
        if (tg && typeof tg.openLink === 'function') {
          tg.openLink(url);
          return true;
        }
        return false;
      };

      // 1) Сначала открываем страницу бота
      const openedBot = openViaTelegram(BOT_INTERSTITIAL);
      if (openedBot) {
        setTimeout(() => {
          // 2) Потом открываем нужный пост
          if (!openViaTelegram(postUrl)) window.open(postUrl, '_blank', 'noopener');
        }, delayMs);
        return;
      }

      // fallback, если Telegram API недоступно:
      window.open(BOT_INTERSTITIAL, '_blank', 'noopener');
      setTimeout(() => window.open(postUrl, '_blank', 'noopener'), delayMs);
    }

    if (typeof maplibregl === 'undefined') {
      console.error('maplibregl is not defined.');
      throw new Error('maplibregl missing');
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          }
        },
        layers: [
          { id: 'osm-tiles', type: 'raster', source: 'osm', minzoom: 0, maxzoom: 19 }
        ]
      },
      center: [MAP_CENTER[1], MAP_CENTER[0]],
      zoom: MAP_ZOOM
    });

    map.on('load', () => console.log('Map loaded OK'));
    map.on('error', (e) => console.error('Map error:', e?.error || e));

    document.addEventListener('click', (e) => {
      const a = e.target?.closest?.('.js-open-post');
      if (!a) return;

      const url = a.getAttribute('data-link');
      if (!url) return;

      e.preventDefault();
      showOverlayAndHideMap();

      openPostWithBotFirst(url);
    });

    for (const p of PLACES) {
      const el = createMarkerElement(p.image);

      const popupHtml = `
        <div class="popup-title">${escapeHtml(p.title || '')}</div>
        <div>${escapeHtml(p.address || '')}</div>
        ${p.tag ? `<div>${escapeHtml(p.tag)}</div>` : ''}
        ${
          p.link
            ? `<a class="popup-link js-open-post" href="${escapeAttr(p.link)}" data-link="${escapeAttr(p.link)}">Открыть пост</a>`
            : ''
        }
      `;

      const popup = new maplibregl.Popup({ offset: [0, -40], closeButton: false }).setHTML(popupHtml);

      new maplibregl.Marker({ element: el, anchor: 'bottom' })
        .setLngLat([p.lng, p.lat])
        .setPopup(popup)
        .addTo(map);
    }
  </script>
</body>
</html>
